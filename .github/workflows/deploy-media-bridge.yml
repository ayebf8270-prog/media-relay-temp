name: Deploy media-bridge v2.4.1 (Cloudflare API)

# Runs only on pushes to the dedicated deploy branch. The default branch and the media relay
# release workflow are never touched. Tests run first; the deploy step only runs if they pass.
on:
  push:
    branches: [deploy/media-bridge-v2.4.1]
    paths:
      - "deploy/media-bridge/**"
      - ".github/workflows/deploy-media-bridge.yml"

permissions:
  contents: read

concurrency:
  group: deploy-media-bridge
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_OVERRIDE: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SCRIPT_NAME: media-bridge
      EXPECT_VERSION: "2.4.1"
      ROLLBACK_VERSION: "2.4.0"
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check and regression tests (no network, no secrets used)
        env:
          CF_TOKEN: ""
          CF_ACCOUNT_OVERRIDE: ""
        run: |
          T="$RUNNER_TEMP/t"; mkdir -p "$T"
          cp deploy/media-bridge/worker.js "$T/new.mjs"
          cp deploy/media-bridge/rollback-v2.4.0.js "$T/old.mjs"
          node --check "$T/new.mjs"
          NEW="$T/new.mjs" OLD="$T/old.mjs" node deploy/media-bridge/test.mjs
      - name: Deploy via Cloudflare API (code only; bindings untouched), verify, auto-rollback on failure
        run: bash deploy/media-bridge/deploy.sh
