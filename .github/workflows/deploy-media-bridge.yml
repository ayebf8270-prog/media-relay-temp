name: Deploy media-bridge (Cloudflare API)

# Runs only on pushes to the dedicated deploy branch. The default branch and the media relay
# release workflow are never touched.
on:
  push:
    branches: [deploy/media-bridge-v2.2.0]
    paths:
      - "deploy/media-bridge/**"
      - ".github/workflows/deploy-media-bridge.yml"

permissions:
  contents: read

concurrency:
  group: deploy-media-bridge
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_OVERRIDE: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SCRIPT_NAME: media-bridge
      EXPECT_VERSION: "2.2.0"
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via Cloudflare API (code only; bindings untouched) and verify
        run: bash deploy/media-bridge/deploy.sh
